# ===============================
#  APPLICATION
# ===============================
spring.application.name=backend
spring.profiles.active=dev

# ===============================
#  DATABASE
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# ===============================
#  LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
#  CORS
# ===============================
app.cors.allowed-origins=http://localhost:5173,https://schoolmanager.ma

# ===============================
#  ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# ===============================
#  SERVER
# ===============================
server.port=8089
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024


app.security.token-hash-secret=8c3f8d1b97d2a7e0fbe7d8e91a91c1d0a5f2b2e3d9e4f6a7b8c9d0e1f2a3b4c5


# === Security / Token Settings ===
jwt.refresh-days=7
app.security.max-active-sessions=3

jwt.expiry-grace-seconds=30


# --- Redis failover strategy ---
# app.redis.fail-closed=false  → Fail-Open  (Development mode)
# app.redis.fail-closed=true   → Fail-Closed (Production mode)
# When true, if Redis is unavailable, authentication & rate-limit checks will block requests.
# When false, Redis failures will allow login and API calls to proceed.
